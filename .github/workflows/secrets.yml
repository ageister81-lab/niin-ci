# Reusable secret scan for repos without a Node project (niin-infra, niin-ci).
name: secrets

on:
  workflow_call:

# Deny by default: a called workflow may not ask for more than its caller grants, and each job
# below requests only what it needs (security.md §9).
permissions: {}

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          extra_args: --results=verified,unknown
