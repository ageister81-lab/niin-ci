# Reusable CI for every Niin TypeScript repo (security.md §10, testing.md).
# Callers: `uses: ageister81-lab/niin-ci/.github/workflows/node.yml@main`
# Actions are pinned by commit SHA (security.md §9); Renovate keeps them current.
name: node

on:
  workflow_call:
    inputs:
      docker:
        description: Build the Dockerfile and scan the image
        type: boolean
        default: false
      codeql:
        description: >-
          Run CodeQL. Needs code scanning: public repos, or GitHub Advanced Security on private ones.
          Off while repos are private on a free personal account (exceptions.md EX-002).
        type: boolean
        default: false

permissions: read-all

jobs:
  check:
    name: typecheck, lint, test, build, audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Dependency audit (fail on high/critical)
        run: pnpm audit --audit-level high

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          extra_args: --results=verified,unknown

  codeql:
    name: codeql
    if: ${{ inputs.codeql }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5

  image:
    name: container build and scan
    if: ${{ inputs.docker }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: niin-ci-scan:${{ github.sha }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: niin-ci-scan:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
